<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Movies Arena — Fandom Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="movies">
  <div id="ambient-bg" aria-hidden="true"></div>

  <header class="hud">
    <a class="brand" href="index.html" aria-label="Fandom Arcade Home">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <span class="brand-text">Fandom<strong>Arcade</strong></span>
    </a>
    <div class="hud-stats">
      <div class="pill" title="Session Score"><span class="pill-label">PTS</span><span id="hud-score">0</span></div>
      <div class="pill streak-pill" title="Current Win Streak"><span aria-hidden="true">🔥</span><span id="hud-streak">0</span></div>
      <button id="sound-toggle" class="icon-btn" type="button" aria-label="Toggle Sound">🔊</button>
    </div>
  </header>

  <nav id="cat-strip" class="cat-strip" aria-label="Game Categories"></nav>

  <main class="container">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="unblur" type="button">🎬 Scene Unblur</button>
      <button class="mode-tab" data-mode="cast" type="button">🎭 Cast Match</button>
    </div>

    <section class="mode-panel active" data-panel="unblur">
      <div class="game-header">
        <div><span class="game-tag">Cinema Challenge</span><h2>Scene Unblur</h2></div>
        <span id="movie-points-badge" class="points-chip">+300 PTS</span>
      </div>
      <div class="filter-row">
        <select id="movie-region" class="gen-select" aria-label="Movie Industry">
          <option value="all">All Cinema</option>
          <option value="hollywood">Hollywood (English)</option>
          <option value="indian">Indian Cinema</option>
          <option value="intl">World / Non-English</option>
        </select>
        <select id="movie-era" class="gen-select" aria-label="Movie Era">
          <option value="all">All Eras</option>
          <option value="modern">Modern (2010+)</option>
          <option value="classic">Classics (Pre-2010)</option>
        </select>
        <div class="seg-toggle">
          <button id="movie-opt-4" class="seg-btn active" type="button">4 Options</button>
          <button id="movie-opt-6" class="seg-btn" type="button">6 Options</button>
        </div>
      </div>
      <p class="game-tip">Identify the movie from the blurred frame. Spend points to unblur further and unlock clues.</p>

      <div class="stage-card movie-stage">
        <div id="movie-loader" class="loader">Loading reel...</div>
        <img id="movie-img" class="movie-img blur-3" alt="Blurred movie frame" />
      </div>

      <div class="action-bar">
        <button id="movie-hint-btn" class="btn btn-secondary" type="button">💡 Unblur &amp; Genre Clue (-75 pts)</button>
        <div id="movie-hints-box" class="hints-box hidden"></div>
      </div>

      <div id="movie-options" class="options-grid"></div>
      <div id="movie-feedback" class="feedback hidden"></div>
      <button id="movie-next-btn" class="btn btn-primary full-width hidden" type="button">Next Movie →</button>
    </section>

    <section class="mode-panel" data-panel="cast">
      <div class="game-header">
        <div><span class="game-tag">Star Power</span><h2>Cast Match</h2></div>
        <span id="cast-points-badge" class="points-chip">+250 PTS</span>
      </div>
      <div class="filter-row">
        <select id="cast-region" class="gen-select" aria-label="Cast Industry">
          <option value="all">All Cinema</option>
          <option value="hollywood">Hollywood (English)</option>
          <option value="indian">Indian Cinema</option>
          <option value="intl">World / Non-English</option>
        </select>
        <div class="seg-toggle">
          <button id="cast-opt-4" class="seg-btn active" type="button">4 Options</button>
          <button id="cast-opt-6" class="seg-btn" type="button">6 Options</button>
        </div>
      </div>
      <p class="game-tip">Which film brings these credited actors together?</p>

      <div class="stage-card cast-stage">
        <div id="cast-loader" class="loader">Assembling cast...</div>
        <div id="cast-reveal-banner" class="cast-reveal-banner hidden"></div>
        <div id="cast-grid" class="cast-grid"></div>
      </div>

      <div class="action-bar">
        <button id="cast-hint-btn" class="btn btn-secondary" type="button">🎭 Reveal Character Names (-75 pts)</button>
      </div>

      <div id="cast-options" class="options-grid"></div>
      <div id="cast-feedback" class="feedback hidden"></div>
      <button id="cast-next-btn" class="btn btn-primary full-width hidden" type="button">Next Cast →</button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/movies.js"></script>
</body>
</html>
